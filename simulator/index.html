<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Simulations — SPRK-Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../theme.css">
</head>
<body data-page="simulations" class="m-0 min-h-screen">
  <main class="mx-auto grid min-h-[70vh] max-w-4xl place-items-center px-5 py-12">
    <section class="w-full max-w-xl rounded-3xl border p-8 text-center shadow-sm sm:p-12" style="border-color:var(--line);background:var(--surface)">
      <div class="mx-auto mb-6 grid h-16 w-16 place-items-center rounded-2xl" style="background:color-mix(in srgb,var(--app-accent) 12%,var(--surface));color:var(--app-accent)"><i data-lucide="orbit" class="h-8 w-8"></i></div>
      <p class="mb-3 text-xs font-bold uppercase tracking-[.18em]" style="color:var(--app-accent)">SPRK Learning Lab</p>
      <h1 class="mb-4 text-3xl font-bold tracking-tight sm:text-4xl">Explore simulations</h1>
      <p class="mb-8 leading-7" style="color:var(--muted)">The simulations hub isn’t included in this website package yet. The rest of your SPRK site is ready to use, and this route is now handled instead of leading to a missing page.</p>
      <a href="../index.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-full px-5 font-semibold text-white no-underline" style="background:var(--app-accent)">Back to home <i data-lucide="arrow-right" class="h-4 w-4"></i></a>
    </section>
  </main>
  <script type="module" src="../js/shell.js"></script>
  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/analytics.js"></script>
</body>
</html>
